name: Daily incremental harvest

# Detects Google Fonts families that were added / updated / removed since the
# last run, re-harvests only that subset, refreshes catalog signals for all
# families, regenerates OG cards for changed families, publishes the dataset AND
# the manifest pointer to R2, then triggers a Cloudflare Deploy Hook. A data-only
# day makes NO git commit. The site serves a static catalog built from
# src/data/fonts.json at deploy time (no database). See tasks/todo.md.

on:
  schedule:
    # 2nd–31st at 12:00 UTC. Avoids the 00:00-UTC midnight peak, where GitHub's
    # scheduler routinely delayed this run by ~3h. The 1st belongs to
    # full-harvest.yml (the monthly whole-catalog reconcile), so daily skips it
    # and the two never collide.
    - cron: "0 12 2-31 * *"
  workflow_dispatch: # allow manual runs

# Shared with full-harvest.yml so a scheduled daily and an ad-hoc manual full run
# can never overlap (a slow harvest must not race another).
concurrency:
  group: harvest
  cancel-in-progress: false

# PREREQUISITES:
#  - CLOUDFLARE_API_TOKEN: R2 read+write on the ChingRu account. fonts.json / og
#    / glyphs AND the manifest (manifest/latest.json) all live in the
#    fontcolle-assets R2 bucket now; git holds no data at all. The Pull/Publish
#    steps call `wrangler r2 object put/get`; without R2 permission they fail.
#  - CLOUDFLARE_DEPLOY_HOOK_URL: a Cloudflare Deploy Hook for the font-fridge
#    Worker. The "Trigger Cloudflare deploy" step POSTs it to redeploy, since no
#    git push happens on a data-only day to drive the Git integration.

# Read-only: this workflow no longer commits (the manifest moved to R2). The
# "Warn if build-time source data drifted" step only reads the working tree.
permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Every harvester step pipes through `tee -a update.log`, and a pipeline's
    # exit status is its LAST command (tee, which always succeeds). Without
    # pipefail a Python traceback -- or a deliberate `sys.exit("ABORT: ...")`
    # guard -- scrolls past and the job marches on to publish + deploy. Seen
    # 2026-08-18: backfill_upstream_activity.py died on a truncated GraphQL
    # response at 900/1302 repos and the run still deployed, green.
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
        with:
          # The harvest commits nothing (manifest lives in R2), so a shallow clone
          # is enough — we only need the working tree to run the scripts and to
          # diff-check scripts.json/languages.json for the drift warning.
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/harvester/requirements.txt

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pip install -r scripts/harvester/requirements.txt

      - name: Pull data assets from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # daily_update.py diffs the harvest against the PREVIOUS fonts.json,
          # the shrinkage guard stats it, and the OG publisher uploads deltas
          # from public/og, none of which live in git anymore. Restore them
          # from R2 (per the manifest) before harvesting.
          node scripts/sync-assets.mjs

      - name: Refresh published signals
        env:
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
        run: python3 scripts/harvester/fetch_published.py

      - name: Incremental catalog update
        id: update
        env:
          # Authenticated GitHub API: enumerating the google/fonts tree
          # unauthenticated hits the 60 req/hr limit and SystemExits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Incremental (lastModified diff) only. The monthly WHOLE-catalog
          # reconcile that used to live here behind a `date +%d = 01` check moved
          # to full-harvest.yml, which owns the 1st of the month; this job's cron
          # runs the 2nd–31st, so the two never collide.
          python3 scripts/harvester/daily_update.py | tee update.log
          # Expose whether anything changed so later steps can skip.
          if grep -q "^no changes$" update.log; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Supplement API-only families
        id: supplement
        env:
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
          # The supplement set is derived (webfonts catalog minus the
          # google/fonts tree), so this step enumerates the repo tree too.
          # Unauthenticated that shares the 60 req/hr bucket and fails.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # daily_update.py only diffs the google/fonts repo tree, so the apiOnly
          # families (today: Google Sans, Google Sans Flex, the Edu Hand batch)
          # served by the webfonts API but absent from the repo are never picked
          # up there. This step re-harvests them from the API and merges into the
          # same fonts.json, appending any changed ids to og_ids.txt. The set is
          # DERIVED per run, not a fixed list: a newly published API-only family
          # is picked up automatically, and one that graduates into the repo is
          # handed back to daily_update. Idempotent: a no-op run reports
          # supplement-changed=0. Runs AFTER daily_update (which writes
          # fonts.json + og_ids.txt) and BEFORE the shrinkage guard (so the
          # merged families are in the baseline the guard and publish see).
          python3 scripts/harvester/harvest_api_supplement.py | tee -a update.log
          # Combined change signal, the single gate the downstream steps read:
          # true when EITHER the repo diff (update step) OR this supplement moved
          # something. Repo-quiet days on which only an apiOnly family bumped must
          # still deploy.
          if [ "${{ steps.update.outputs.changed }}" = "true" ] \
             || grep -qE "^supplement-changed=[1-9]" update.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh classification tags and derived Category class
        id: classify
        run: |
          # `tags` (the google/fonts classification scores) and the `category`
          # derived from them are NOT produced by the harvest: to_record() only
          # sees the webfonts API, whose `apiCategory` is coarser than the tag tree
          # Google's own site browses by. Both steps must therefore re-run on
          # every harvest, or a re-harvested family silently reverts (Inconsolata
          # scores /Monospace 100 but its API category is SANS_SERIF, so it would
          # drop from Mono back to Sans). See [[reharvest-drops-backfills]].
          #
          # contrast (google/fonts quant.csv) and displayName (the metadata batch
          # endpoint) join the same window: each is a SINGLE upstream fetch then
          # an in-memory join, not per-family, so running them whole-catalog every
          # day is cheap and — like tags — catches an upstream refresh on a
          # repo-quiet day AND fills the field for a newly harvested family
          # (to_record leaves both null; they are not TTF-derived).
          #
          # Runs unconditionally, not behind supplement.outputs.changed: these
          # sources update on their own cadence. All scripts are idempotent.
          #
          # Checksum around them so an upstream-only day still deploys: without
          # this the refreshed fonts.json would sit on the runner unpublished, and
          # every later run would redo the same work forever.
          before=$(shasum -a 256 src/data/fonts.json | cut -d' ' -f1)
          python3 scripts/harvester/backfill_tags.py 2>&1 | tee -a update.log
          python3 scripts/harvester/backfill_form_category.py 2>&1 | tee -a update.log
          # Must follow form_category: it overrides that result for slab-tagged
          # families (Slab is a peer of Sans/Serif, not a Serif sub-style), and
          # folds any legacy "Emoji" category back into Graphics.
          python3 scripts/harvester/backfill_slab_category.py 2>&1 | tee -a update.log
          python3 scripts/harvester/backfill_contrast.py 2>&1 | tee -a update.log
          python3 scripts/harvester/backfill_display_names.py 2>&1 | tee -a update.log
          after=$(shasum -a 256 src/data/fonts.json | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sweep upstream repo activity
        id: upstream
        env:
          # GraphQL rejects anonymous calls outright, so this token is required
          # rather than merely advisable.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Whole-catalog, UNCONDITIONAL. This is the only signal that answers
          # "is the font's own repo still maintained"; lastModifiedApi is
          # Google's batch re-serving date (57 distinct values over 1942
          # families) and modifiedMs is just when Google last compiled the TTF.
          #
          # Deliberately NOT gated on supplement/classify, and deliberately not
          # scoped by og_ids.txt: those ids come from daily_update.py's diff,
          # which keys off lastModifiedApi. A family whose upstream moved but
          # which Google has not re-served would never be re-checked, i.e. the
          # field would rot exactly where it matters most.
          #
          # Affordable because families are grouped by repo (1942 -> ~1275) and
          # batched 50 per GraphQL query: a full sweep measured 26 points of the
          # 5000/hr budget. The script aborts without writing if >20% of repos
          # fail to resolve (bad token / outage, not 400 dead repos).
          before=$(shasum -a 256 src/data/fonts.json | cut -d' ' -f1)
          python3 scripts/harvester/backfill_upstream_activity.py \
            --stale-versions-out=scripts/harvester/version_ids.txt \
            2>&1 | tee -a update.log
          after=$(shasum -a 256 src/data/fonts.json | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against catalog shrinkage
        if: steps.supplement.outputs.changed == 'true' || steps.classify.outputs.changed == 'true' || steps.upstream.outputs.changed == 'true'
        env:
          # The guard imports scripts/lib/r2.mjs (for the manifest helpers),
          # which requires an account id at module load even when it makes no
          # remote call. Every step that touches r2.mjs needs these.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A harvest that loses 20%+ of the dataset almost certainly means an
          # upstream fetch failed, not a real removal. Fail before publishing so
          # a corrupt dataset never deploys. fonts.json no longer lives in git,
          # so the guard compares the new local fonts.json against the byte count
          # recorded in the CURRENT manifest (still the previous version, this
          # runs BEFORE the Publish step rewrites it).
          node scripts/shrinkage-guard.mjs

      - name: Regenerate OG cards for newly harvested families
        if: steps.supplement.outputs.changed == 'true' || steps.classify.outputs.changed == 'true' || steps.upstream.outputs.changed == 'true'
        run: |
          # Only newly added/updated families need a fresh card (rank shifts
          # don't change the image). Skip when none were harvested.
          if [ -s scripts/harvester/og_ids.txt ]; then
            node scripts/gen-og-images.mjs --ids=scripts/harvester/og_ids.txt
          else
            echo "no families re-harvested; OG cards unchanged"
          fi

      - name: Regenerate glyph coverage for newly harvested families
        id: glyphs
        if: steps.supplement.outputs.changed == 'true' || steps.classify.outputs.changed == 'true' || steps.upstream.outputs.changed == 'true'
        run: |
          # public/glyphs/<id>.json (the cmap ranges the Glyphs panel renders) is
          # a cache-reading backfill, NOT part of the harvest: daily_update and
          # harvest_api_supplement seed each new family's primary TTF into
          # ttf_cache precisely so this step can derive its coverage. Without it,
          # a supplement family (Google Sans, Edu Hand) shipped a record but no
          # coverage file, so its /glyphs/<id>.json 404'd live and the panel was
          # empty. Only the harvested ids (og_ids.txt) need recomputing.
          if [ -s scripts/harvester/og_ids.txt ]; then
            python3 scripts/harvester/backfill_glyph_coverage.py \
              $(tr '\n' ' ' < scripts/harvester/og_ids.txt) 2>&1 | tee -a update.log
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no families re-harvested; glyph coverage unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Backfill repo-derived fields for newly harvested families
        if: steps.supplement.outputs.changed == 'true' || steps.classify.outputs.changed == 'true' || steps.upstream.outputs.changed == 'true'
        env:
          # version_history walks git history via the authenticated GitHub API
          # (60 req/hr unauthenticated would stall). license fetches raw OFL.txt.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # licenseHeader (per-family OFL copyright) and versionHistory (release
          # timeline from google/fonts git) are repo-derived, per-family fetches
          # not carried by the harvest. Unlike contrast/displayName (one shared
          # fetch, folded into classify above), these cost one request PER family,
          # so they run ONLY over the newly harvested ids — a repo-quiet day makes
          # no call. apiOnly families (no repo) simply resolve to null, which is
          # correct for them. Scoped by --ids so the whole-catalog cost is never
          # paid daily.
          if [ -s scripts/harvester/og_ids.txt ]; then
            ids=$(paste -sd, scripts/harvester/og_ids.txt)
            python3 scripts/harvester/backfill_license.py --ids="$ids" 2>&1 | tee -a update.log
            python3 scripts/harvester/backfill_version_history.py --ids="$ids" 2>&1 | tee -a update.log
            # gfTtfCommitDate: newest commit touching a font file in the
            # family's google/fonts directory. Same per-family REST cost model
            # as the two above (~2 calls each), so it belongs in this --ids
            # scoped step rather than the whole-catalog upstream sweep. Scoping
            # by og_ids.txt IS sound here, unlike for upstreamHeadDate: a new
            # TTF landing in google/fonts is normally followed by Google
            # re-serving the family, so the lastModifiedApi diff that built
            # these ids does fire (Scheherazade New: TTF 2026-04-23 ->
            # lastModifiedApi 2026-05-13). The residual ~3-week lag
            # self-corrects on a later run.
            python3 scripts/harvester/backfill_gf_ttf_date.py --ids="$ids" 2>&1 | tee -a update.log
          else
            echo "no families re-harvested; repo-derived fields unchanged"
          fi
          # Independently of the harvest diff: the upstream sweep lists families
          # whose newest upstream TAG is newer than their last recorded
          # versionHistory entry, i.e. a release we have not picked up. Without
          # this, versionHistory only ever refreshes for families lastModifiedApi
          # says changed, so an upstream release Google has not yet packaged
          # would never appear.
          if [ -s scripts/harvester/version_ids.txt ]; then
            vids=$(paste -sd, scripts/harvester/version_ids.txt)
            echo "refreshing versionHistory for $(wc -l < scripts/harvester/version_ids.txt) families with a newer upstream tag"
            python3 scripts/harvester/backfill_version_history.py --ids="$vids" --force 2>&1 | tee -a update.log
          else
            echo "no families with a newer upstream tag"
          fi

      - name: Publish assets to R2
        if: steps.supplement.outputs.changed == 'true' || steps.classify.outputs.changed == 'true' || steps.upstream.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Upload the new fonts.json as fonts/<YYYYMMDD>.json and the changed OG
          # cards as per-object deltas, then rewrite src/data/data-manifest.json
          # to point at the new snapshot. Old versions are expired by an R2
          # lifecycle rule on the fonts/ prefix, not by this step. This runs
          # AFTER the shrinkage guard (which read the old manifest baseline).
          node scripts/publish-assets.mjs --daily --og-ids=scripts/harvester/og_ids.txt
          # glyph coverage has no per-object delta channel (unlike OG): the whole
          # tarball is re-sealed when any family was harvested this run, so a new
          # family's coverage actually reaches R2. Rewrites only the manifest's
          # glyphs entry (fonts/og from the --daily call above are preserved).
          if [ "${{ steps.glyphs.outputs.changed }}" = "true" ]; then
            node scripts/publish-assets.mjs --reseed-glyphs
          fi

      # No commit step anymore. The manifest lives in R2 (manifest/latest.json),
      # rewritten by the Publish step above, so a data-only harvest produces ZERO
      # git commits — killing the daily "chore: daily incremental font catalog
      # update" noise. Deploy is triggered explicitly below via a Cloudflare
      # Deploy Hook instead of by a git push.

      - name: Warn if build-time source data drifted
        if: steps.supplement.outputs.changed == 'true' || steps.classify.outputs.changed == 'true' || steps.upstream.outputs.changed == 'true'
        run: |
          # scripts.json / languages.json are build-time imports compiled into the
          # bundle (src/lib/fonts/labels.ts), NOT pulled from R2 at runtime, so
          # they stay git-versioned. They change very rarely. A harvest is not
          # allowed to auto-commit them (that reintroduced the daily commit); if
          # one drifts, surface it so a human ships it in a normal commit. The
          # deploy below still goes out with the R2 data update regardless.
          if ! git diff --quiet -- src/data/scripts.json src/data/languages.json; then
            echo "::warning::scripts.json/languages.json changed this run but are not auto-committed. Review and commit them manually:"
            git --no-pager diff --stat -- src/data/scripts.json src/data/languages.json
          else
            echo "build-time source data unchanged"
          fi

      - name: Trigger Cloudflare deploy
        if: steps.supplement.outputs.changed == 'true' || steps.classify.outputs.changed == 'true' || steps.upstream.outputs.changed == 'true'
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          # The R2 data (fonts snapshot, OG deltas, glyphs, and the manifest
          # pointer) is now current, but nothing pushed to git, so Cloudflare's
          # Git integration won't build. Fire the Deploy Hook to run a fresh
          # build+deploy, which re-syncs the R2 assets per the new manifest. This
          # is the sole deploy path for a data-only day. (A real source change —
          # scripts.json etc., committed by a human — still deploys via the Git
          # integration on push, same as any code change.)
          if [ -z "$CLOUDFLARE_DEPLOY_HOOK_URL" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK_URL secret is not set; cannot deploy the R2 update"
            exit 1
          fi
          curl -fsS -X POST "$CLOUDFLARE_DEPLOY_HOOK_URL" | tee deploy-hook.log
          echo "deploy hook fired"
