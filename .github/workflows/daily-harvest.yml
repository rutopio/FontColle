name: Daily incremental harvest

# Detects Google Fonts families that were added / updated / removed since the
# last run, re-harvests only that subset, refreshes catalog signals for all
# families, regenerates OG cards for changed families, commits the dataset, and
# deploys. The site serves a static catalog built from src/data/fonts.json at
# deploy time (no database). See tasks/todo.md for the design rationale.

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch: # allow manual runs

# Prevent overlapping runs (a slow harvest must not race the next day's).
concurrency:
  group: daily-harvest
  cancel-in-progress: false

# PREREQUISITE: the CLOUDFLARE_API_TOKEN secret must have R2 read+write on the
# ChingRu account before this version of the workflow can run. fonts.json / og /
# glyphs now live in the fontcolle-assets R2 bucket (git holds only
# src/data/data-manifest.json). The Publish and Deploy steps call
# `wrangler r2 object put/get`; without R2 permission they fail.

permissions:
  contents: write # commit the updated dataset / seed / OG images

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # fonts.json left git, so the daily commit is now just the tiny
          # data-manifest.json diff, a shallow clone is enough. The commit step
          # unshallows on demand before rebasing if a manual push landed mid-run.
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # No `version:` on purpose. action-setup falls back to package.json's
      # `packageManager` field, so the runner's pnpm tracks the pinned version
      # instead of floating on the latest 10.x.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          # daily_update -> to_dataset.apply_specimens -> langcov needs the full
          # Google Fonts language stack, not just fonttools. Pins live in
          # scripts/harvester/requirements.txt (CLAUDE.md: pin exact versions).
          pip install -r scripts/harvester/requirements.txt

      - name: Pull data assets from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # daily_update.py diffs the harvest against the PREVIOUS fonts.json,
          # the shrinkage guard stats it, and the OG publisher uploads deltas
          # from public/og, none of which live in git anymore. Restore them
          # from R2 (per the manifest) before harvesting.
          node scripts/sync-assets.mjs

      - name: Refresh published signals
        env:
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
        run: python3 scripts/harvester/fetch_published.py

      - name: Incremental catalog update
        id: update
        env:
          # Authenticated GitHub API: enumerating the google/fonts tree
          # unauthenticated hits the 60 req/hr limit and SystemExits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/harvester/daily_update.py | tee update.log
          # Expose whether anything changed so later steps can skip.
          if grep -q "^no changes$" update.log; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Supplement API-only families
        id: supplement
        env:
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
        run: |
          # daily_update.py only diffs the google/fonts repo tree, so the apiOnly
          # families (Google Sans, Google Sans Flex, Edu Hand batch) served by the
          # webfonts API but absent from the repo are never picked up there. This
          # step re-harvests them from the API and merges into the same
          # fonts.json, appending any changed ids to og_ids.txt. Idempotent: a
          # no-op run reports supplement-changed=0. Runs AFTER daily_update (which
          # writes fonts.json + og_ids.txt) and BEFORE the shrinkage guard (so the
          # merged families are in the baseline the guard and publish see).
          python3 scripts/harvester/harvest_api_supplement.py | tee -a update.log
          # Combined change signal, the single gate the downstream steps read:
          # true when EITHER the repo diff (update step) OR this supplement moved
          # something. Repo-quiet days on which only an apiOnly family bumped must
          # still deploy.
          if [ "${{ steps.update.outputs.changed }}" = "true" ] \
             || grep -qE "^supplement-changed=[1-9]" update.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh classification tags and derived Category class
        id: classify
        run: |
          # `tags` (the google/fonts classification scores) and the `class`
          # derived from them are NOT produced by the harvest: to_record() only
          # sees the webfonts API, whose `category` is coarser than the tag tree
          # Google's own site browses by. Both steps must therefore re-run on
          # every harvest, or a re-harvested family silently reverts (Inconsolata
          # scores /Monospace 100 but its API category is SANS_SERIF, so it would
          # drop from Mono back to Sans). See [[reharvest-drops-backfills]].
          #
          # Runs unconditionally, not behind supplement.outputs.changed: the tags
          # CSV is updated upstream on its own cadence, so a repo-quiet day can
          # still move a family between Category cards. Both scripts are
          # idempotent and cost ~10s combined.
          #
          # Checksum around them so a tags-only day still deploys: without this
          # the reclassified fonts.json would sit on the runner unpublished, and
          # every later run would redo the same work forever.
          before=$(shasum -a 256 src/data/fonts.json | cut -d' ' -f1)
          python3 scripts/harvester/backfill_tags.py 2>&1 | tee -a update.log
          python3 scripts/harvester/backfill_form_class.py 2>&1 | tee -a update.log
          after=$(shasum -a 256 src/data/fonts.json | cut -d' ' -f1)
          if [ "$before" != "$after" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against catalog shrinkage
        if: steps.supplement.outputs.changed == 'true' || steps.classify.outputs.changed == 'true'
        env:
          # The guard imports scripts/lib/r2.mjs (for the manifest helpers),
          # which requires an account id at module load even when it makes no
          # remote call. Every step that touches r2.mjs needs these.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A harvest that loses 20%+ of the dataset almost certainly means an
          # upstream fetch failed, not a real removal. Fail before publishing so
          # a corrupt dataset never deploys. fonts.json no longer lives in git,
          # so the guard compares the new local fonts.json against the byte count
          # recorded in the CURRENT manifest (still the previous version, this
          # runs BEFORE the Publish step rewrites it).
          node scripts/shrinkage-guard.mjs

      - name: Regenerate OG cards for newly harvested families
        if: steps.supplement.outputs.changed == 'true' || steps.classify.outputs.changed == 'true'
        run: |
          # Only newly added/updated families need a fresh card (rank shifts
          # don't change the image). Skip when none were harvested.
          if [ -s scripts/harvester/og_ids.txt ]; then
            node scripts/gen-og-images.mjs --ids=scripts/harvester/og_ids.txt
          else
            echo "no families re-harvested; OG cards unchanged"
          fi

      - name: Publish assets to R2
        if: steps.supplement.outputs.changed == 'true' || steps.classify.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Upload the new fonts.json as fonts/<YYYYMMDD>.json and the changed OG
          # cards as per-object deltas, then rewrite src/data/data-manifest.json
          # to point at the new snapshot. Old versions are expired by an R2
          # lifecycle rule on the fonts/ prefix, not by this step. This runs
          # AFTER the shrinkage guard (which read the old manifest baseline).
          node scripts/publish-assets.mjs --daily --og-ids=scripts/harvester/og_ids.txt

      - name: Commit updated manifest
        if: steps.supplement.outputs.changed == 'true' || steps.classify.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # fonts.json and public/og now live in R2; git versions only the tiny
          # data-manifest.json (which R2 versions the site ships) plus the small
          # scripts.json / languages.json. The static catalog the site serves is a
          # build artifact, the Deploy step's `pnpm build` regenerates it.
          git add src/data/data-manifest.json src/data/scripts.json \
            src/data/languages.json
          if git diff --cached --quiet; then
            echo "nothing staged; skipping commit"
          else
            git commit -m "chore: daily incremental font catalog update"
            # A manual push to master during the run makes the shallow push
            # non-fast-forward. Unshallow (fetch-depth 1 has no history to rebase
            # onto), then rebase onto the latest master and retry a few times.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push rejected (attempt $attempt); unshallowing + rebasing onto origin/master"
              git fetch --unshallow origin || git fetch origin
              git pull --rebase origin master
            done
          fi

      # No deploy step here on purpose. The manifest commit pushed above is what
      # ships the new dataset: Cloudflare's Git integration picks up the push and
      # builds + deploys from it (its build re-syncs the R2 assets per the new
      # manifest). This workflow used to also run `pnpm build && wrangler deploy`,
      # but wrangler.jsonc has no `routes` and workers_dev/preview_urls are both
      # false, so fontcolle.com is served via a dashboard Custom Domain that the
      # Git integration's deployment owns. The result was two deployments ~40s
      # apart, the second always superseding the first. Deploy lives in exactly
      # one place now; if the Git integration is ever turned off, this workflow
      # needs its deploy step back.
