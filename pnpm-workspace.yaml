packages: []

# Wait a week after publish before a version is installable, so a compromised
# release has time to be caught and yanked upstream.
minimumReleaseAge: 10080

# Fail the install on a Node older than package.json's engines field, so the
# local/CI/.nvmrc versions cannot drift apart again.
engineStrict: true

# Stops pnpm aborting `pnpm run` in non-TTY/CI environments.
verifyDepsBeforeRun: false

# Packages allowed to run install scripts (pnpm 11 blocks them by default).
# workerd is the Workers runtime behind `pnpm preview` / wrangler dev.
onlyBuiltDependencies:
  - esbuild
  - workerd

allowBuilds:
  esbuild: true
  workerd: true

# Security pins for transitive-only advisories (pnpm audit). Every entry is
# capped below the next major: an unbounded ">=x" silently resolves to a new
# major when upstream ships one and breaks consumers still on the old one.
# All of these reach us through devDependencies (shadcn, @tanstack/react-start,
# @tailwindcss/vite), so none ships in the deployed bundle. Drop an entry once
# the parent dependency ships a patched version on its own.
overrides:
  brace-expansion: ">=5.0.9 <6"
  fast-uri: ">=3.1.5 <4"
  hono: ">=4.13.1 <5"
  "@hono/node-server": ">=1.19.17 <2"
  ip-address: ">=10.5.0 <11"
  js-yaml: ">=4.3.1 <5"
  nanoid: ">=3.3.18 <4"
  postcss: ">=8.5.26 <9"
  undici: ">=7.29.0 <8"
